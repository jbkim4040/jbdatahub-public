name: Multi-Agent PR Review (v1 — 규칙 기반)
on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  security:
    name: 🔒 Security Agent
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: gitleaks (secret 스캔)
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Trivy FS scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
        continue-on-error: true
      - name: Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: p/owasp-top-ten p/security-audit p/secrets
        continue-on-error: true

  style:
    name: 🎨 Style Agent
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: ESLint (UI 변경 있을 때만)
        run: |
          if [ -d ui/jbdatahub ]; then
            cd ui/jbdatahub && npm ci --no-audit && npx eslint src --ext .jsx,.js || exit 1
          fi
        continue-on-error: true
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: ruff (admin-portal backend)
        run: |
          pip install ruff
          ruff check admin-portal/backend/ || exit 1
        continue-on-error: true

  performance:
    name: ⚡ Performance Agent
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: SQL 패턴 lint (N+1 위험)
        run: |
          # 단순 grep — 추후 sqlfluff 등으로 강화
          ! grep -rn 'for.*in.*:.*\n.*execute\|fetchrow' admin-portal/backend/routes/ 2>/dev/null | head -5 || true
      - name: Java 복잡도 (큰 메서드 경고)
        run: |
          # 100+ line method 감지
          awk '/public .*\(/{count=1; name=$0} count>0 && /\}/{if(count>100) print FILENAME": "name" ("count" lines)"; count=0} count>0{count++}' \
            server/jbdatahub/src/main/java/com/jb/datahub/**/*.java 2>/dev/null | head -10 || true

  test:
    name: 🧪 Test Agent
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: 테스트 추가 여부 검사 (변경/신규 코드에 대응 테스트)
        run: |
          CHANGED=$(git diff --name-only origin/master...HEAD | grep -E '\.java$|\.py$|\.jsx$' || true)
          TESTS=$(git diff --name-only origin/master...HEAD | grep -E 'Test\.java$|test_.*\.py$|\.test\.jsx$' || true)
          if [ -n "$CHANGED" ] && [ -z "$TESTS" ]; then
            echo "⚠️ 코드 변경 있는데 테스트 없음 (강제 X, 경고)"
          fi

  decide:
    name: 🎯 Orchestrator — 과반수 결정
    runs-on: ubuntu-latest
    needs: [security, style, performance, test]
    if: always()
    steps:
      - name: 결과 집계 + 머지
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 각 needs 결과 (success / failure / cancelled)
          declare -A R
          R[security]="${{ needs.security.result }}"
          R[style]="${{ needs.style.result }}"
          R[performance]="${{ needs.performance.result }}"
          R[test]="${{ needs.test.result }}"
          approve=0
          total=4
          for agent in security style performance test; do
            if [ "${R[$agent]}" = "success" ]; then approve=$((approve+1)); fi
          done
          echo "approve=$approve / $total"
          PR=${{ github.event.pull_request.number }}
          if [ $approve -ge 2 ]; then
            gh pr comment $PR --body "✅ Multi-Agent: $approve / $total APPROVE → 자동 머지 진행"
            gh pr merge $PR --squash --auto || true
          else
            gh pr comment $PR --body "🛑 Multi-Agent: $approve / $total — 과반수 미달, 머지 보류"
          fi
