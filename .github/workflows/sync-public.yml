name: Sync to Public Portfolio

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: sync-public
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    if: github.repository == 'jbkim4040/jb-workspace'
    steps:
      - name: Checkout (master)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Extract source commit metadata
        id: meta
        run: |
          SUBJECT=$(git log -1 --pretty=%s)
          BODY=$(git log -1 --pretty=%b)
          AUTHOR_NAME=$(git log -1 --pretty=%an)
          AUTHOR_EMAIL=$(git log -1 --pretty=%ae)
          echo "author_name=$AUTHOR_NAME" >> $GITHUB_OUTPUT
          echo "author_email=$AUTHOR_EMAIL" >> $GITHUB_OUTPUT
          {
            echo "subject<<EOF"
            echo "$SUBJECT"
            echo "EOF"
          } >> $GITHUB_OUTPUT
          {
            echo "body<<EOF"
            echo "$BODY"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Sanitize sensitive data
        run: |
          set -euo pipefail
          mkdir -p /tmp/public-build
          rsync -a --delete \
            --exclude='.git' \
            --exclude='.idea' \
            --exclude='CLAUDE.md' \
            --exclude='node_modules' \
            --exclude='build' \
            --exclude='dist' \
            --exclude='target' \
            --exclude='.gradle' \
            --exclude='.github' \
            ./ /tmp/public-build/

          cd /tmp/public-build
          # 운영 서버 IP → placeholder
          find . -type f \( -name "*.md" -o -name "*.yml" -o -name "*.yaml" \
            -o -name "*.sh" -o -name "*.py" -o -name "*.java" \
            -o -name "*.conf" -o -name "*.tmpl" -o -name "Jenkinsfile*" \
            -o -name "*.js" -o -name "*.jsx" \) -print0 \
            | xargs -0 sed -i \
              -e 's|140\.245\.74\.59|<WAS_HOST>|g' \
              -e 's|152\.69\.232\.44|<DB_HOST>|g' \
              -e 's|168\.107\.20\.90|<CI_HOST>|g' \
              -e 's|158\.180\.65\.135|<LEGACY_HOST>|g' \
              -e 's|10\.0\.0\.148|<WAS_INTERNAL>|g' \
              -e 's|10\.0\.0\.156|<CI_INTERNAL>|g' \
              -e 's|10\.0\.0\.188|<DB_INTERNAL>|g'

          # admin-portal config.py 기본값 환경변수화
          if [ -f admin-portal/backend/config.py ]; then
            grep -q '^import os' admin-portal/backend/config.py || sed -i '1i import os' admin-portal/backend/config.py
            sed -i 's|app_server_host: str = .*|app_server_host: str = os.environ.get("APP_SERVER_HOST", "127.0.0.1")|' admin-portal/backend/config.py
            sed -i 's|db_host: str = .*|db_host: str = os.environ.get("DB_HOST", "localhost")|' admin-portal/backend/config.py
          fi

          # README/LICENSE 템플릿 적용
          if [ -f tools/portfolio/README.md ]; then
            cp tools/portfolio/README.md README.md
          fi
          if [ -f tools/portfolio/LICENSE ]; then
            cp tools/portfolio/LICENSE LICENSE
          fi
          # 도구 디렉토리는 portfolio repo에서 제외 (template 자체는 공개 안 함)
          rm -rf tools/portfolio

          # 최종 secret 검증 — 노출 시 빌드 실패
          if grep -rE "140\.245\.74\.59|152\.69\.232\.44|168\.107\.20\.90" . ; then
            echo "::error::ServerIP 잔존 — 동기화 중단"
            exit 1
          fi
          if grep -rE --exclude-dir=.github --exclude=README.md "ghp_[A-Za-z0-9]{36}|jb-internal-svc-token-[0-9]{4}" . ; then
            echo "::error::Secret/token literal 잔존 — 동기화 중단"
            exit 1
          fi

      - name: Push to public repo (force orphan)
        env:
          PUBLIC_PAT: ${{ secrets.PUBLIC_REPO_PAT }}
        run: |
          set -euo pipefail
          cd /tmp/public-build
          git init -q -b main
          git add -A
          # 원본 커밋 메시지 그대로 사용 + mirror trailer 추가
          cat > /tmp/sync-commit-msg.txt <<COMMITEOF
          ${{ steps.meta.outputs.subject }}

          ${{ steps.meta.outputs.body }}

          ---
          🔄 Synced from jbkim4040/jb-workspace@${GITHUB_SHA::10} ($(date -u +%Y-%m-%dT%H:%M:%SZ))
          COMMITEOF
          # heredoc 들여쓰기 제거
          sed -i 's/^          //' /tmp/sync-commit-msg.txt
          git config user.email "${{ steps.meta.outputs.author_email }}"
          git config user.name "${{ steps.meta.outputs.author_name }}"
          git commit -F /tmp/sync-commit-msg.txt -q
          git remote add origin "https://jbkim4040:${PUBLIC_PAT}@github.com/jbkim4040/jbdatahub-public.git"
          git push --force origin main
          echo "✅ Synced to https://github.com/jbkim4040/jbdatahub-public"
