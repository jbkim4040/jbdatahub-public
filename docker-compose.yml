services:

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
    depends_on:
      - jbdatahubui
      - jbdatahub
    restart: unless-stopped
    networks:
      - app-network

  jbdatahubui:
    build:
      context: ./jbDataHubUI
      dockerfile: Dockerfile
    container_name: jbdatahubui
    restart: unless-stopped
    networks:
      - app-network

  jbdatahub:
    build:
      context: ./jbDataHub
      dockerfile: Dockerfile
    container_name: jbdatahub
    restart: unless-stopped
    env_file:
      - .env                          # 시크릿은 .env 파일에서 읽음
    environment:
      - SPRING_PROFILES_ACTIVE=prod   # prod 프로필 활성화
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
