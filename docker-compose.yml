services:

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - jbDataHubUI
      - jbDataHub
    restart: unless-stopped
    networks:
      - app-network

  jbDataHubUI:
    build:
      context: ./jbDataHubUI
      dockerfile: Dockerfile
    container_name: jbDataHubUI
    restart: unless-stopped
    networks:
      - app-network

  jbDataHub:
    build:
      context: ./jbDataHub
      dockerfile: Dockerfile
    container_name: jbDataHub
    restart: unless-stopped
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    networks:
      - app-network

networks:
  app-network:
    driver: bridge