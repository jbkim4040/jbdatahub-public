# SSL 공통 설정
ssl_certificate     /etc/nginx/ssl/selfsigned.crt;
ssl_certificate_key /etc/nginx/ssl/selfsigned.key;
ssl_protocols       TLSv1.2 TLSv1.3;
ssl_ciphers         HIGH:!aNULL:!MD5;
ssl_session_cache   shared:SSL:10m;
ssl_session_timeout 10m;

# proxy_set_header는 location에 하나라도 정의 시 상위 상속이 끊기므로
# 공통 헤더는 각 location에서 직접 명시
proxy_read_timeout 120s;

# HTTP → HTTPS 리다이렉트
server {
    listen 80 default_server;
    return 301 https://$host$request_uri;
}

# Admin Portal — jbdatahub.com (default)
server {
    listen 443 ssl default_server;
    listen 8080 ssl;
    server_name jbdatahub.com www.jbdatahub.com _;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    location / {
        proxy_pass              http://172.17.0.1:18080;
        proxy_set_header        Host              $host;
        proxy_set_header        X-Real-IP         $remote_addr;
        proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto https;
        proxy_set_header        X-Forwarded-Port  443;
    }
}

# Jenkins — jenkins.jbdatahub.com
server {
    listen 443 ssl;
    listen 9090 ssl;
    server_name jenkins.jbdatahub.com;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    location / {
        proxy_pass              http://127.0.0.1:19090;
        proxy_request_buffering off;
        proxy_set_header        Host              $host;
        proxy_set_header        X-Real-IP         $remote_addr;
        proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto https;
        proxy_set_header        X-Forwarded-Port  443;
        proxy_set_header        X-Forwarded-Host  $host;
    }
}

# Grafana — grafana.jbdatahub.com
server {
    listen 443 ssl;
    listen 3000 ssl;
    server_name grafana.jbdatahub.com;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    location / {
        proxy_pass              http://127.0.0.1:13000;
        proxy_set_header        Host              $host;
        proxy_set_header        X-Real-IP         $remote_addr;
        proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto https;
        proxy_set_header        X-Forwarded-Port  443;
    }
    location /loki/ {
        auth_basic              "Loki Push";
        auth_basic_user_file    /etc/nginx/auth/loki.htpasswd;
        client_max_body_size    50m;
        proxy_pass              http://127.0.0.1:3100/loki/;
        proxy_set_header        Host              $host;
        proxy_set_header        X-Real-IP         $remote_addr;
        proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto https;
        proxy_read_timeout      60s;
    }
}

