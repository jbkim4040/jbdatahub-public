plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.14'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.owasp.dependencycheck' version '11.1.1'
}

group = 'com.jb'
version = '0.0.1-SNAPSHOT'
description = 'jbDataHub'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'com.github.ben-manes.caffeine:caffeine'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-registry-prometheus'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.16'

    // JWT (JJWT 0.12.x)
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly  'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly  'io.jsonwebtoken:jjwt-jackson:0.12.6'

    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'io.projectreactor:reactor-test'
    runtimeOnly 'org.postgresql:postgresql'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
    useJUnitPlatform()
}

// OWASP Dependency-Check
// 실행: ./gradlew dependencyCheckAnalyze --info
// NVD API 키 사용 시: -PnvdApiKey=<key> 로 전달
// Jenkins 메인 파이프라인엔 비활성. 별도 stage("Security Scan") 또는 cron 으로 실행.
dependencyCheck {
    formats = ['HTML', 'JSON']
    outputDirectory = "$buildDir/reports/dependency-check"
    failBuildOnCVSS = 11           // 리포트만 생성, 빌드 실패시키지 않음
    suppressionFile = file('dependency-check-suppressions.xml').exists()
        ? 'dependency-check-suppressions.xml' : null
    nvd {
        apiKey = project.findProperty('nvdApiKey') ?: System.getenv('NVD_API_KEY') ?: ''
    }
    analyzers {
        assemblyEnabled = false    // .NET 분석기 비활성 (불필요)
        nodeAuditEnabled = false
        nodeEnabled = false
    }
    skipConfigurations = ['developmentOnly', 'testImplementation', 'testRuntimeOnly',
                          'testCompileOnly', 'testAnnotationProcessor']
}
