# 운영 환경 — 실제 값은 .env 또는 서버 환경변수로 주입
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 10000       # 10초 (기본 30초)
      initialization-fail-timeout: 1  # 시작 시 1ms만 대기 후 앱 실행 (연결 실패해도 기동)
      minimum-idle: 1                 # 초기 연결 최소화 (startup 단축)
      maximum-pool-size: 10
      connection-init-sql: "SET default_transaction_read_only = off"
      idle-timeout: 300000
      max-lifetime: 600000
  jpa:
    open-in-view: false               # OSIV 끔 — 불필요한 세션 유지 제거
    hibernate:
      ddl-auto: none                  # 메타데이터 접근 안 하므로 validate 의미 없음
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect    # 명시 → JDBC metadata 조회 생략
        boot:
          allow_jdbc_metadata_access: false                  # startup 시 DB 메타데이터 일괄 조회 차단 (가장 큰 효과)
        temp:
          use_jdbc_metadata_defaults: false                  # Supabase pgBouncer 환경에서 metadata 조회 회피

publicdata:
  api:
    base-url: ${PUBLIC_API_BASE_URL}
    path: ${PUBLIC_API_PATH}
    service-key: ${PUBLIC_API_SERVICE_KEY}

admin:
  username: ${ADMIN_USERNAME}
  password: ${ADMIN_PASSWORD}

jwt:
  secret: ${JWT_SECRET}
  expiration: 900000    # 15분 (ms)

logging:
  level:
    org.hibernate.SQL: WARN
    com.jb.datahub: INFO
  structured:
    format: ecs

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
