# 모니터링 스택 (prometheus / alertmanager / grafana)
# 메인 docker-compose.yml과 동일한 외부 네트워크에 연결되며,
# Jenkins 배포와 별개로 1회 셋업 후 항상 떠 있어야 함.
#
# 최초 기동:
#   docker compose -f docker-compose.monitoring.yml up -d
# 설정 갱신 후 재로드:
#   docker exec prometheus  wget -q -O - --post-data "" http://localhost:9090/-/reload
#   docker exec alertmanager wget -q -O - --post-data "" http://localhost:9093/-/reload

services:

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - prometheus-data:/prometheus
    networks:
      - app-network

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: alertmanager
    restart: unless-stopped
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    networks:
      - app-network

  grafana:
    image: grafana/grafana:11.3.0
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-changeme}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks:
      - app-network

volumes:
  prometheus-data:
  alertmanager-data:
  grafana-data:

networks:
  app-network:
    external: true
    name: jb-workspace_app-network
