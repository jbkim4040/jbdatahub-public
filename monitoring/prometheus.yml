global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    cluster: jb-workspace
    env: prod

rule_files:
  - /etc/prometheus/alert.rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  # Blue/Green 둘 다 등록: nginx 전환과 무관하게 active 인 쪽만 응답하므로 scrape 안정.
  # 둘 다 다운일 때만 BackendDown alert 트리거 (alert.rules.yml 참고)
  - job_name: 'jbdatahub-was'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 30s
    static_configs:
      - targets: ['140.245.74.59:8080', '140.245.74.59:8081']
        labels:
          service: jbdatahub
          app: backend

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
