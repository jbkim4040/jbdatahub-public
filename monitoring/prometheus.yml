global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    cluster: jb-workspace
    env: prod

rule_files:
  - /etc/prometheus/alert.rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'jbdatahub'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 30s
    static_configs:
      - targets: ['ACTIVE_COLOR:8080']
        labels:
          service: jbdatahub
          app: backend

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
