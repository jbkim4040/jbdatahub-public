# 운영 환경 — 실제 값은 .env 또는 서버 환경변수로 주입
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 10000       # 10초 (기본 30초)
      initialization-fail-timeout: 1  # 시작 시 1ms만 대기 후 앱 실행 (연결 실패해도 기동)
      minimum-idle: 2
      maximum-pool-size: 10
      idle-timeout: 300000
      max-lifetime: 600000
  jpa:
    open-in-view: false               # OSIV 끔 — 불필요한 세션 유지 제거

publicdata:
  api:
    base-url: ${PUBLIC_API_BASE_URL}
    path: ${PUBLIC_API_PATH}
    service-key: ${PUBLIC_API_SERVICE_KEY}

admin:
  username: ${ADMIN_USERNAME}
  password: ${ADMIN_PASSWORD}
  portal:
    url: ${ADMIN_PORTAL_URL:https://admin.jbdatahub.com}
    internal-token: ${ADMIN_PORTAL_INTERNAL_TOKEN}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:https://jbdatahub.com}

management:
  endpoints:
    web:
      exposure:
        include: "health"
  endpoint:
    health:
      show-details: never

jwt:
  secret: ${JWT_SECRET}
  expiration: 3600000   # 1시간 (ms)

logging:
  level:
    org.hibernate.SQL: WARN
    com.jb.datahub: INFO
