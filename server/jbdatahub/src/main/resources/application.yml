spring:
  application:
    name: jbDataHub
    # required/example param fields deployed
  mvc:
    async:
      request-timeout: 15000   # 비동기(Mono) 컨트롤러 응답 타임아웃(ms) — invoke 8s + 마진
  lifecycle:
    timeout-per-shutdown-phase: 25s
  profiles:
    active: local
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=200,expireAfterWrite=10m
  datasource:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 3
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: jbDataHub-HikariPool
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 100
          batch_versioned_data: true
        order_inserts: true
        order_updates: true
    show-sql: false

jwt:
  expiration: 900000  # 15분 (ms) — 로컬 기본값

server:
  port: 8080
  forward-headers-strategy: framework
  shutdown: graceful

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true
    try-it-out-enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health, metrics, info, prometheus
  endpoint:
    health:
      show-details: when_authorized
  info:
    env:
      enabled: false

